# MarGem home server — laptop runs API + Postgres + local image storage
# Usage: docker compose -f docker-compose.home.yml --env-file .env.home up -d --build
#
# Default STORAGE_BACKEND=local stores images on the laptop (no Azure required).
# Set STORAGE_BACKEND=azure + AZURE_STORAGE_CONNECTION_STRING to use Blob instead.

services:
  postgres:
    image: postgres:16-alpine
    container_name: margem-home-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: margemadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: margem
    volumes:
      - margem_home_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margemadmin -d margem"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: margem-home-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      AUTH_DEV_BYPASS: "false"
      DATABASE_URL: postgresql+asyncpg://margemadmin:${POSTGRES_PASSWORD}@postgres:5432/margem
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_MEDIA_ROOT: /data/media
      SERVE_EMBEDDED_ADMIN: "false"
      ADMIN_DASHBOARD_DIR: ""
      ADMIN_REQUIRE_STAFF_MFA: ${ADMIN_REQUIRE_STAFF_MFA:-true}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: margem-media
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-MarGem <noreply@margem.ma>}
      # Home LAN servers often have no SMTP; tokens are logged server-side only.
      ALLOW_INSECURE_EMAIL_FALLBACK: ${ALLOW_INSECURE_EMAIL_FALLBACK:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      JWT_ACCESS_EXPIRE_MINUTES: "60"
      JWT_REFRESH_EXPIRE_DAYS: "7"
      RATE_LIMIT: ${RATE_LIMIT:-300/minute}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30/minute}
    volumes:
      - margem_home_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  admin:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: margem-home-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    environment:
      MARGEM_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      ADMIN_BASIC_AUTH_USER: ${ADMIN_BASIC_AUTH_USER:-}
      ADMIN_BASIC_AUTH_PASSWORD: ${ADMIN_BASIC_AUTH_PASSWORD:-}
      ADMIN_ALLOW_PUBLIC: ${ADMIN_ALLOW_PUBLIC:-false}
      ADMIN_EXTRA_ALLOWED_CIDRS: ${ADMIN_EXTRA_ALLOWED_CIDRS:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  margem_home_pg:
  margem_home_media:
