services:
  postgres:
    image: postgres:16-alpine
    container_name: margem-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-souq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-souq_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-souq_local}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-souq} -d ${POSTGRES_DB:-souq_local}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: margem-api
    ports:
      - "0.0.0.0:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://souq:souq_local_dev@postgres:5432/souq_local}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-in-production-min-32-chars}
      UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET:-local-dev-upload-token-secret-change-in-production-min-32-chars}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_MEDIA_ROOT: /data/media
      PUBLIC_API_URL: ${WEB_PUBLIC_API_URL:-${PUBLIC_API_URL:-http://localhost:8000}}
      PUBLIC_APP_URL: ${WEB_PUBLIC_SITE_URL:-${PUBLIC_APP_URL:-http://localhost:3000}}
      ADMIN_DASHBOARD_DIR: /admin-dashboard
      AUTH_DEV_BYPASS: "false"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      ALLOW_INSECURE_EMAIL_FALLBACK: ${ALLOW_INSECURE_EMAIL_FALLBACK:-true}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@dribex.ma}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Dribex}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000","http://localhost:8080","http://10.0.2.2:8000"]'}
    volumes:
      - api_media:/data/media
      - ./admin-dashboard:/admin-dashboard:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: margem-admin
    ports:
      - "${ADMIN_PORT:-8080}:80"
    environment:
      MARGEM_API_URL: ${WEB_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${WEB_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${WEB_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_LAUNCH_CITIES: Casablanca
    container_name: margem-web
    ports:
      - "0.0.0.0:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DRIBEX_WEB_IN_DOCKER: "1"
      API_BASE_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${WEB_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_URL: ${WEB_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_LAUNCH_CITIES: Casablanca
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_media:
