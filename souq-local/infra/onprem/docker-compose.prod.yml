# Dribex on-prem production stack (Ubuntu)
# Usage:
#   cp env.prod.example .env.prod
#   ./scripts/deploy.sh
#
# Public exposure: nginx (80/443) only.
# Internal: postgres, redis, minio, vault, api, prometheus, grafana, loki.

name: margem-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-margem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-margem}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-margem} -d ${POSTGRES_DB:-margem}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      VAULT_LOCAL_CONFIG: |
        {
          "storage": {"file": {"path": "/vault/file"}},
          "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}],
          "ui": false,
          "disable_mlock": true
        }
    command: server
    volumes:
      - vault_data:/vault/file
    networks: [internal]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      AUTH_DEV_BYPASS: "false"
      ALLOW_MANUAL_BILLING: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-margem}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-margem}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET:?set UPLOAD_TOKEN_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:?set ADMIN_IP_ALLOWLIST}
      ADMIN_REQUIRE_STAFF_MFA: ${ADMIN_REQUIRE_STAFF_MFA:-true}
      SERVE_EMBEDDED_ADMIN: ${SERVE_EMBEDDED_ADMIN:-false}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-selfhosted}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-margem-media}
      MINIO_BUCKET_PROFILES: ${MINIO_BUCKET_PROFILES:-dribex-profiles}
      MINIO_BUCKET_PRODUCTS: ${MINIO_BUCKET_PRODUCTS:-dribex-products}
      MINIO_BUCKET_LISTINGS: ${MINIO_BUCKET_LISTINGS:-dribex-listings}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-dribex-private}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-brevo}
      BREVO_API_KEY: ${BREVO_API_KEY:?set BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@dribex.ma}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Dribex}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@dribex.ma}
      EMAIL_SEND_TIMEOUT_SECONDS: ${EMAIL_SEND_TIMEOUT_SECONDS:-20}
      EMAIL_MAX_RETRIES: ${EMAIL_MAX_RETRIES:-2}
      EMAIL_RETRY_DELAY_SECONDS: ${EMAIL_RETRY_DELAY_SECONDS:-0.75}
      ALLOW_INSECURE_EMAIL_FALLBACK: ${ALLOW_INSECURE_EMAIL_FALLBACK:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-mad}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      SUBSCRIPTIONS_ENABLED: ${SUBSCRIPTIONS_ENABLED:-false}
      ADS_ENABLED: ${ADS_ENABLED:-true}
      REWARDED_ADS_ENABLED: ${REWARDED_ADS_ENABLED:-false}
      REWARDED_AD_SIGNING_SECRET: ${REWARDED_AD_SIGNING_SECRET:?set REWARDED_AD_SIGNING_SECRET}
      NAPS_ENVIRONMENT: ${NAPS_ENVIRONMENT:-sandbox}
      NAPS_MERCHANT_ID: ${NAPS_MERCHANT_ID:-}
      NAPS_API_KEY: ${NAPS_API_KEY:-}
      NAPS_SECRET_KEY: ${NAPS_SECRET_KEY:-}
      NAPS_WEBHOOK_SECRET: ${NAPS_WEBHOOK_SECRET:-}
      NAPS_EPAY_PAYMENT_INIT_URL: ${NAPS_EPAY_PAYMENT_INIT_URL:-}
      NAPS_EPAY_PAYMENT_STATUS_URL: ${NAPS_EPAY_PAYMENT_STATUS_URL:-}
      NAPS_WEBHOOK_SIGNATURE_HEADER: ${NAPS_WEBHOOK_SIGNATURE_HEADER:-X-NAPS-Signature}
      RATE_LIMIT: ${RATE_LIMIT:-300/minute}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30/minute}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_APP_URL}
        NEXT_PUBLIC_LAUNCH_CITIES: ${NEXT_PUBLIC_LAUNCH_CITIES:-Casablanca}
    restart: unless-stopped
    environment:
      DRIBEX_WEB_IN_DOCKER: "1"
      API_BASE_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_APP_URL}
      NEXT_PUBLIC_LAUNCH_CITIES: ${NEXT_PUBLIC_LAUNCH_CITIES:-Casablanca}
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    depends_on: [prometheus, loki]

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [internal]

networks:
  internal:
    internal: true
  edge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  vault_data:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_logs:
